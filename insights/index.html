<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JF+ Insights Mock</title>
<style>
/* Mock of change 790 as built: the client's Progress tab (JF+ button + three graphs), the member and non-member
   states, and the trainer's view of their own client's Insights. Made-up people and numbers only. No external
   requests. Tokens copied from app-v3 (mobile.css, ios26.css, insights.css, trainer-theme.css). */
:root {
  --m-page: #f6f8fb; --m-card: #ffffff; --m-inset: #f1f4f9; --m-ink: #14161f; --m-body: #3e424d; --m-muted: #7e8494;
  --m-faint: #a7adbb; --m-navy: #1f2025; --m-on-navy: #ffffff; --m-hairline: rgba(60,60,67,.12); --m-r-card: 22px;
  --m-shadow-card: 0 1px 2px rgba(31,32,37,.04), 0 14px 34px -22px rgba(31,32,37,.22);
  --ios-tint: #5b43d6; --ios-sep: rgba(60,60,67,.29);
  --jf-ins-gold-line: rgba(212,165,55,.55); --jf-ins-gold-ink: #8a5a00;
  --hc-a: #5b43d6; --hc-b: #237318; --hc-c: #b04d00; --hc-d: #6c6c70; --hc-goal: #8a5a00;
  --band-good: rgba(35,115,24,.42); --band-bad: rgba(198,40,40,.42);
  --t-canvas: #f2f2f7; --t-tile: #ffffff; --t-card: #e9eef6; --t-fill: rgba(118,118,128,.12); --t-ink: #000; --t-ink2: rgba(60,60,67,.76);
  --t-ink3: rgba(60,60,67,.3); --t-hair: rgba(60,60,67,.18); --t-primary: #255fbf; --t-accent: #0a5fc8; --t-alert-ink: #c4321b;
  --t-success: #8bd42a; --t-info: #4da3ff; --t-health: #1fc7a6; --t-effort: #f5a524;
  --chrome: #e8ebf0; --chrome-ink: #222;
}
html[data-dark] {
  --m-page: #000; --m-card: #1c1c1e; --m-inset: #2c2c2e; --m-ink: #fff; --m-body: #ebebf5; --m-muted: #98989f; --m-faint: #636366;
  --m-navy: #ffffff; --m-on-navy: #000000; --m-hairline: rgba(84,84,88,.5); --m-shadow-card: none; --ios-tint: #8f7cff; --ios-sep: rgba(84,84,88,.65);
  --jf-ins-gold-line: rgba(243,199,95,.45); --jf-ins-gold-ink: #f3c75f;
  --hc-a: #8f7cff; --hc-b: #30d158; --hc-c: #ff9f0a; --hc-d: #aeaeb2; --hc-goal: #f3c75f;
  --band-good: rgba(48,209,88,.45); --band-bad: rgba(255,105,97,.5);
  --t-canvas: #000; --t-tile: #1c1c1e; --t-card: #2c2c2e; --t-fill: rgba(118,118,128,.24); --t-ink: #fff; --t-ink2: rgba(235,235,245,.66);
  --t-ink3: rgba(235,235,245,.3); --t-hair: rgba(84,84,88,.65); --t-primary: #2468d6; --t-accent: #3b9bff; --t-alert-ink: #ff8a7a;
  --chrome: #1b1d22; --chrome-ink: #e6e6e6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--chrome); color: var(--chrome-ink); font-family: Mulish, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; background: var(--chrome); border-bottom: 1px solid rgba(127,127,127,.25); }
.bar fieldset { border: 0; margin: 0; padding: 0; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.bar legend { float: left; font-size: 12px; font-weight: 700; margin-right: 6px; opacity: .7; }
.bar button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit; cursor: pointer; }
.bar button[aria-pressed="true"] { background: #1f2025; color: #fff; border-color: #1f2025; }

.trainer .status { color: var(--t-ink); }
.scroll { flex: 1; overflow-y: auto; padding: 0 16px 40px; }
.device[data-w="ipad"] .scroll > .col { max-width: 560px; margin: 0 auto; }
.device.trainer[data-w="ipad"] .scroll > .col { max-width: 680px; }
.note-strip { font-size: 12px; margin: 0 0 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,214,102,.18); color: var(--m-ink); border: 1px dashed var(--jf-ins-gold-line); }
.trainer .note-strip { color: var(--t-ink); }

/* ---------- client Progress (as on /m/progress) ---------- */
.nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; height: 44px; }

/* ---------- the JF+ card (progress-jfplus.css + insights.css) ---------- */
.jpg-card { display: grid; gap: 12px; background: var(--m-card); border-radius: var(--m-r-card); padding: 17px; box-shadow: var(--m-shadow-card); }

.trainer .hc .grid { stroke: var(--t-hair); } .trainer .hc .tick, .trainer .legend { fill: var(--t-ink2); color: var(--t-ink2); }

/* ---------- locked Insights page (today, unchanged) ---------- */
.ins-hero { display: flex; align-items: center; gap: 12px; padding: 6px 2px 10px; } .ins-hero h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--m-ink); }
.ins-hero p { margin: 2px 0 0; font-size: 13px; font-weight: 600; color: var(--m-muted); }

.unlock { margin-top: -180px; position: relative; display: grid; justify-items: center; gap: 10px; padding: 20px 18px; border-radius: 22px; background: var(--m-card); box-shadow: inset 0 0 0 1px var(--jf-ins-gold-line), var(--m-shadow-card); text-align: center; color: var(--m-ink); }
.unlock h2 { margin: 0; font-size: 20px; } .unlock ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; text-align: left; }

.unlock .price { margin: 0; font-size: 13px; color: var(--m-muted); font-weight: 600; }

/* ---------- trainer (trainer-theme.css, trainer-clients.css, insights-trainer.css) ---------- */
.tc-nav { display: flex; align-items: center; min-height: 44px; }
.tc-back { display: inline-flex; align-items: center; gap: 2px; border: 0; background: transparent; color: var(--t-accent); font: inherit; font-size: 17px; cursor: pointer; padding: 0; }
.tc-hero { display: grid; justify-items: center; gap: 6px; padding: 6px 0 14px; } .av { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: var(--t-card); color: var(--t-ink); font-weight: 700; font-size: 28px; }
.tc-hero .n { font-size: 22px; font-weight: 700; color: var(--t-ink); } .tc-hero .st { font-size: 15px; color: var(--t-ink2); }

.tg { margin-top: 18px; border-radius: 12px; background: var(--t-tile); overflow: hidden; }
.tr { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; position: relative; color: var(--t-ink); cursor: pointer; border: 0; background: transparent; width: 100%; font: inherit; text-align: left; }
.tr + .tr::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--t-hair); transform: scaleY(.5); }
.tr .tx { flex: 1; min-width: 0; display: grid; } .tr .t { font-size: 17px; } .tr .s { font-size: 14px; color: var(--t-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .chev { color: var(--t-ink3); } .tr.new { box-shadow: inset 3px 0 0 var(--jf-ins-gold-line); }
.tico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: 0 0 auto; }
.tci-hero { display: flex; align-items: center; gap: 12px; padding: 6px 4px 4px; } .tci-hero h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--t-ink); } .tci-hero p { margin: 2px 0 0; font-size: 15px; color: var(--t-ink2); }
.tci-weeks { display: grid; grid-template-columns: repeat(3,1fr); gap: 2px; margin: 12px 0 4px; padding: 2px; border-radius: 9px; background: var(--t-fill); }
.tci-weeks button { min-height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--t-ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.tci-weeks button[aria-pressed="true"] { background: var(--t-tile); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.tsec { font-size: 22px; font-weight: 700; color: var(--t-ink); margin: 22px 4px 10px; }
.tiles { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 11px; }
.device[data-w="ipad"] .tiles { grid-template-columns: repeat(3,minmax(0,1fr)); }
.tile { display: grid; gap: 3px; padding: 14px 15px; border-radius: 16px; background: var(--t-tile); }
.tile .k { font-size: 13px; font-weight: 700; color: var(--t-ink2); } .tile .v { font-size: 22px; font-weight: 800; color: var(--t-ink); } .tile .v small { font-size: 13px; color: var(--t-ink2); margin-left: 4px; }
.tile .d { font-size: 13px; font-weight: 800; } .tile .d.good { color: #237318; } .tile .d.bad { color: #b04d00; } .tile .d.flat { color: var(--t-ink2); }
html[data-dark] .tile .d.good { color: #30d158; } html[data-dark] .tile .d.bad { color: #ff9f0a; }
.tile .s { font-size: 12px; color: var(--t-ink2); font-weight: 600; }
.tci-card { display: grid; gap: 4px; margin-top: 12px; padding: 14px 16px; border-radius: 16px; background: var(--t-tile); }
.tci-card h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--t-ink); } .tci-card .lead { margin: 0; font-size: 13px; color: var(--t-ink2); line-height: 1.4; }
.tci-sub { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--t-ink); } .tci-note { margin: 4px 0 0; font-size: 13px; color: var(--t-ink2); line-height: 1.4; }
.tci-note.strong { color: var(--t-ink); font-weight: 600; } .tci-note.flag { color: var(--t-alert-ink); font-weight: 600; }
.tc-state { padding: 16px; font-size: 15px; color: var(--t-ink2); } .foot { font-size: 13px; color: var(--t-ink2); padding: 10px 16px 0; }
@media (max-width: 430px) { .stage { padding: 12px 0 30px; } .device { border-radius: 0; box-shadow: none; height: auto; min-height: 844px; } }
@media (prefers-reduced-motion: reduce) { .jf-pjp-btn:active { transform: none; } }

<body>
<div class="bar" role="toolbar" aria-label="Mock controls">
  <fieldset><legend>Screen</legend>
    <button data-k="screen" data-v="progress" aria-pressed="true">Client: Progress</button>
    <button data-k="screen" data-v="card" aria-pressed="false">Trainer: client card</button>
    <button data-k="screen" data-v="tins" aria-pressed="false">Trainer: client's Insights</button>
  </fieldset>
  <fieldset id="f-client"><legend>Client</legend>
    <button data-k="client" data-v="member-on" aria-pressed="true">JF+ member, flag on (new)</button>
    <button data-k="client" data-v="member-off" aria-pressed="false">JF+ member, flag off (today)</button>
    <button data-k="client" data-v="non" aria-pressed="false">Not on JF+ (today)</button>
    <button data-k="client" data-v="empty" aria-pressed="false">Member, no food logged</button>
  </fieldset>
  <fieldset id="f-trainer" hidden><legend>Trainer</legend>
    <button data-k="trainer" data-v="on" aria-pressed="true">Flag on, own client</button>
    <button data-k="trainer" data-v="off" aria-pressed="false">Flag off (today)</button>
    <button data-k="trainer" data-v="other" aria-pressed="false">Another trainer's client</button>
  </fieldset>
  <fieldset><legend>Width</legend>
    <button data-k="w" data-v="phone" aria-pressed="true">Phone 390</button>
    <button data-k="w" data-v="ipad" aria-pressed="false">iPad 820</button>
  </fieldset>
  <fieldset><legend>Look</legend>
    <button data-k="theme" data-v="light" aria-pressed="true">Light</button>
    <button data-k="theme" data-v="dark" aria-pressed="false">Dark</button>
  </fieldset>
</div>
<div class="stage"><div class="device" id="device" data-w="phone"><div class="status"><span>9:41</span><span>JF Coach</span></div><div class="scroll" id="scroll"><div class="col" id="view"></div></div></div></div>

<script>
/* ---------- made-up data: Sam C., a client of trainer Tess A.; last 4 weeks to Sun 15 Nov 2026 ---------- */
const BMR = Math.round(10 * 58 + 6.25 * 167 - 5 * 39 - 161);           // 1268, Mifflin-St Jeor, female 39 167 cm 58 kg
const TDEE = Math.round((10 * 58 + 6.25 * 167 - 5 * 39 - 161) * 1.375); // 1743, lightly active
const iso = (d) => d.toISOString().slice(0, 10);
const days = Array.from({ length: 28 }, (_, i) => { const d = new Date(Date.UTC(2026, 9, 19)); d.setUTCDate(d.getUTCDate() + i); return iso(d); });
const rnd = (seed) => { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; };
const r = rnd(7);
const food = [], energy = [];
days.forEach((date, i) => {
  const logged = r() > 0.22;
  const active = Math.round(280 + r() * 300);
  const eaten = logged ? Math.round(1260 + r() * 520) : null;
  const tef = eaten ? Math.round(eaten * 0.1) : 0;
  const out = BMR + active + tef;
  if (logged) food.push({ date, cal: eaten, protein: Math.round(88 + r() * 40), carbs: Math.round(110 + r() * 70), fat: Math.round(38 + r() * 22) });
  const gap = eaten ? out - eaten : null;
  energy.push({ date, eaten, out, onTrack: eaten != null ? gap >= 270 && gap <= 550 : undefined });
});
const both = energy.filter((e) => e.eaten != null);
const avgGap = Math.round(both.reduce((s, e) => s + (e.out - e.eaten), 0) / both.length);
const fmt = (n) => Math.round(n).toLocaleString("en-AU");
const weeks = ["2026-10-19", "2026-10-26", "2026-11-02", "2026-11-09"];
const steps = [6820, 7410, 8150, 7930], sleep = [6.6, 7.1, 6.9, 7.4];
const weigh = [["2026-10-20", 59.6], ["2026-10-27", 59.3], ["2026-11-03", 58.9], ["2026-11-09", 58.6], ["2026-11-14", 58.0]];
const hr = days.filter((_, i) => i % 2 === 0).map((d, i) => [d, 62 - Math.round(i / 3)]);
const mood = days.filter((_, i) => i % 3 === 1).map((d, i) => [d, [4, 3, 4, 5, 4, 4, 5, 4, 5, 4][i % 10]]);

/* ---------- a small copy of HealthChart's geometry (round ticks, gutter, dotted/solid refs, bands) ---------- */
function niceTicks(vals, n = 4) {
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi) { lo -= 1; hi += 1; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(+v.toFixed(6));
  return { t, a, b };
}
const lbl = (v) => (Math.abs(v) >= 10000 ? `${(v / 1000).toLocaleString("en-AU", { maximumFractionDigits: 1 })}k` : v.toLocaleString("en-AU", { maximumFractionDigits: 1 }));
const short = (d) => { const x = new Date(d + "T00:00:00Z"); return `${x.getUTCDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][x.getUTCMonth()]}`; };
function chart({ lines, goal = null, goalLabel = "Goal", refs = [], bands = [], height = 130, unit = "" }) {
  const pts = lines.flatMap((l) => l.points); if (!pts.length) return "";
  const vals = pts.map((p) => p[1]).concat(goal ? [goal] : [], refs.map((x) => x.value));
  const s = niceTicks(vals); const gutter = Math.max(26, Math.max(...s.t.map((v) => lbl(v).length)) * 7.4 + 12);
  const W = 320, H = height, top = 8, bottom = 20, left = gutter, right = 8;
  const ts = pts.map((p) => Date.parse(p[0])), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const x = (d) => (t1 === t0 ? (left + W - right) / 2 : left + ((Date.parse(d) - t0) / (t1 - t0)) * (W - left - right));
  const y = (v) => top + (1 - (v - s.a) / (s.b - s.a || 1)) * (H - top - bottom);
  let g = s.t.map((v) => `<line class="grid" x1="${left}" x2="${W - right}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${lbl(v)}</text>`).join("");
  if (goal) g += `<line x1="${left}" x2="${W - right}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--hc-goal)" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  const bw = Math.max(3, Math.min(14, ((W - left - right) / Math.max(1, (t1 - t0) / 864e5 + 1)) * 0.6));
  g += bands.map((b) => { const y1 = y(Math.max(b.eaten, b.out)), y2 = y(Math.min(b.eaten, b.out)); return `<rect x="${x(b.date) - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(1.5, y2 - y1)}" rx="1.5" fill="var(--band-${b.good ? "good" : "bad"})"/>`; }).join("");
  g += refs.map((rf) => `<line x1="${left}" x2="${W - right}" y1="${y(rf.value)}" y2="${y(rf.value)}" stroke="var(--hc-goal)" ${rf.style === "dotted" ? 'stroke-width="2" stroke-dasharray="1.6 3.2" stroke-linecap="round"' : 'stroke-width="1.8"'}/>`).join("");
  g += lines.map((l) => `<polyline fill="none" stroke="var(--hc-${l.tone})" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${l.points.map((p) => `${x(p[0])},${y(p[1])}`).join(" ")}"/>` + (l.points.length <= 40 ? l.points.map((p) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="2.6" fill="var(--hc-${l.tone})"/>`).join("") : "")).join("");
  g += `<text class="tick" x="${left}" y="${H - bottom + 15}">${short(new Date(t0).toISOString().slice(0, 10))}</text><text class="tick" x="${W - right}" y="${H - bottom + 15}" text-anchor="end">${short(new Date(t1).toISOString().slice(0, 10))}</text>`;
  const spoken = lines.map((l) => `${l.label}: ${l.points.length} points, latest ${fmt(l.points.at(-1)[1])}${unit}`).join(". ");
  let legend = "";
  if (lines.length > 1 || refs.length || goal) {
    legend = `<div class="legend" aria-hidden="true">${lines.map((l) => `<span><i style="color:var(--hc-${l.tone})"></i>${l.label}</span>`).join("")}${goal ? `<span><i class="dash" style="color:var(--hc-goal)"></i>${goalLabel}</span>` : ""}${refs.map((rf) => `<span><i class="${rf.style === "dotted" ? "dot" : ""}" style="color:var(--hc-goal)"></i>${rf.label}</span>`).join("")}${bands.some((b) => b.good) ? '<span><i class="band" style="background:var(--band-good)"></i>On track</span>' : ""}${bands.some((b) => !b.good) ? '<span><i class="band" style="background:var(--band-bad)"></i>Off track</span>' : ""}</div>`;
  }
  return `<figure class="hc" style="margin:4px 0 0"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${spoken}">${g}</svg>${legend}</figure>`;
}
const crest = (size = 30) => `<svg width="${size}" height="${size}" viewBox="0 0 32 32" role="img" aria-label="JF+"><g fill="#d4a537">${Array.from({ length: 8 }, (_, i) => `<rect x="12" y="1.5" width="8" height="8" rx="2" transform="rotate(${i * 45} 16 16)"/>`).join("")}<circle cx="16" cy="16" r="11"/></g><path d="M16 10v12M10 16h12" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/></svg>`;
const chev = '<svg class="chev" width="8" height="13" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ico = (bg, path) => `<span class="ico" style="background:${bg}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg></span>`;

/* ---------- screens ---------- */
const state = { screen: "progress", client: "member-on", trainer: "on", w: "phone", theme: "light", page: null };

function calories() { const pts = food.map((f) => [f.date, f.cal]); const avg = pts.reduce((s, p) => s + p[1], 0) / pts.length; const diff = avg - 1500;
  return { pts, vs: `Averaging ${fmt(avg)} kcal, ${fmt(Math.abs(diff))} kcal ${diff > 0 ? "above" : "below"} your 1,500 kcal goal.` }; }
function macroCharts(h) { const goals = { protein: 110, carbs: null, fat: 50 }; return ["protein", "carbs", "fat"].map((k, i) => `<div>${h(k[0].toUpperCase() + k.slice(1) + " (g)")}${chart({ lines: [{ label: `${k[0].toUpperCase() + k.slice(1)} eaten`, tone: ["b", "c", "d"][i], points: food.map((f) => [f.date, f[k]]) }], goal: goals[k], goalLabel: `${k[0].toUpperCase() + k.slice(1)} target`, height: 92, unit: " g" })}</div>`).join(""); }
function energyChart() { return chart({ lines: [{ label: "Energy out", tone: "c", points: energy.map((e) => [e.date, e.out]) }, { label: "Energy in", tone: "a", points: both.map((e) => [e.date, e.eaten]) }],
  refs: [{ label: "BMR", value: BMR, style: "dotted" }, { label: "TDEE", value: TDEE, style: "solid" }], bands: both.map((e) => ({ date: e.date, eaten: e.eaten, out: e.out, good: e.onTrack })), height: 140, unit: " kcal" }); }

function memberCard(empty) {
  const c = calories();
  const graphs = empty ? `<p class="jpg-note">Your calories, macros and energy show here once you log food.</p>` : `
    <div class="jf-pjp-graph"><p class="sub">Calories</p>${chart({ lines: [{ label: "Calories eaten", tone: "a", points: c.pts }], goal: 1500, goalLabel: "Calorie target", height: 120, unit: " kcal" })}<p class="jpg-note vs">${c.vs}</p></div>
    <div class="jf-pjp-graph"><p class="sub">Protein, carbs and fat</p>${macroCharts((t) => `<p class="k2">${t}</p>`)}</div>
    <div class="jf-pjp-graph"><p class="sub">Energy in vs energy out</p>${energyChart()}
      <p class="jpg-note strong">On the ${both.length} days with both logged, you were in a deficit of about ${fmt(avgGap)} kcal a day.</p>
      <p class="jpg-note">Dotted line: BMR, about ${fmt(BMR)} kcal a day. Solid line: TDEE, about ${fmt(TDEE)} kcal a day.</p></div>`;
  return `<section class="jpg-card jf-pjp" aria-label="JF+ Insights">
    <div class="jf-pjp-head">${crest(30)}<div class="jpg-head"><span class="klabel">JF+ · Last 4 weeks</span><h2>Your JF+ Insights</h2></div></div>
    <button class="jf-pjp-btn" data-go="ins-member">Open JF+ Insights</button>${graphs}</section>`;
}
function insightsRow(member) {
  return `<div class="list"><button class="row" data-go="${member ? "ins-member" : "ins-locked"}">${crest(26)}<span class="tx"><span class="t">${member ? "See JF+ Insights" : "JF+ Insights"}</span><span class="s">${member ? "Your weeks side by side, and this week's JFI review" : "Your trends week by week, with a weekly review from JFI"}</span></span>${chev}</button></div>`;
}
function progress() {
  const c = state.client;
  const jf = c === "member-on" ? memberCard(false) : c === "empty" ? memberCard(true) : insightsRow(c === "member-off");
  const strip = c === "member-on" || c === "empty" ? "NEW (flag progressJfPlus on or demo): a JF+ member gets this card." : c === "member-off" ? "TODAY (flag off): the same row Progress has shown since 4 Oct." : "TODAY and with the flag on: a client without JF+ keeps the row; it opens the locked page and the existing paywall.";
  return `<div class="nav"><span class="chip" aria-label="Back">‹</span><span class="ttl">Progress</span><span class="chip" aria-label="Log weight">+</span></div>
    <p class="note-strip">${strip}</p>
    <p class="lt-k">Since Mon 3 Aug</p><h1 class="lt-t">Progress</h1>
    <a class="cover"><small>Goal</small><b>55.0 kg</b><span class="gbar"><i></i></span><span>3.0 kg to go · 46% of the way</span></a>
    <div class="seg"><span>1M</span><span>3M</span><span>6M</span><span>1Y</span><span class="on">All</span></div>
    <div class="wcard"><span class="h"><span>Body weight</span>›</span><span class="k">Latest · 14 Nov</span><span class="num">58.0<small>kg</small></span>${chart({ lines: [{ label: "Weight", tone: "a", points: weigh }], height: 110, unit: " kg" })}</div>
    <div class="list">
      <div class="row">${ico("#7a5af8", '<rect x="2.5" y="8" width="19" height="8" rx="2"/><path d="M6.5 8v3M10 8v4M13.5 8v3M17 8v4"/>')}<span class="tx"><span class="t">Measurements</span></span><span class="v">9 Nov</span>${chev}</div>
      <div class="row">${ico("#7a5af8", '<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/>')}<span class="tx"><span class="t">Progress photos</span></span><span class="v">2 Nov</span>${chev}</div>
      <div class="row">${ico("#14b8a6", '<path d="m3.5 6.5 1.8 1.8L8.6 5M3.5 14.5l1.8 1.8 3.3-3.3M12 7h8.5M12 15h8.5"/>')}<span class="tx"><span class="t">Weekly check-ins</span></span><span class="v">Fri</span>${chev}</div>
    </div>
    <div class="list"><div class="row">${ico("#f5a524", '<path d="M8 4h8v4a4 4 0 0 1-8 0V4ZM12 12v5M8 20h8"/>')}<span class="tx"><span class="t">Awards</span><span class="s">6 earned</span></span>${chev}</div></div>
    ${jf}
    <div class="list"><div class="row">${ico("#4da3ff", '<path d="M4 20V4M4 20h16M8 15.5l3.5-4 3 2.5L20 8"/>')}<span class="tx"><span class="t">More stats</span><span class="s">Lifts, sleep, cardio and every metric</span></span>${chev}</div></div>`;
}
function insMember() {
  return `<div class="nav"><button class="chip" data-go="back" aria-label="Back">‹</button><span class="ttl" style="opacity:1">JF+ Insights</span><span></span></div>
    <p class="note-strip">The existing /m/plus/insights page (unchanged by this change), opened by the button.</p>
    <header class="ins-hero">${crest(34)}<div><h1>JF+ Insights</h1><p>Last 12 weeks · Updated 16 Nov</p></div></header>
    <section class="jpg-card"><span class="klabel">16 Nov</span><div class="jpg-head"><h2>Your JFI review</h2></div><p class="jpg-note">Three things JFI noticed and one thing to try (unchanged).</p></section>
    <section class="jpg-card" style="margin-top:11px"><div class="jpg-head"><span class="klabel">Estimate</span><h2>Energy in vs energy out</h2></div>${energyChart()}</section>`;
}
function insLocked() {
  return `<div class="nav"><button class="chip" data-go="back" aria-label="Back">‹</button><span class="ttl" style="opacity:1">JF+ Insights</span><span></span></div>
    <p class="note-strip">TODAY, unchanged (JFPLUS-V2-CONTRACT.md): the locked page. "Unlock JF+ Insights" opens the shared JfPlusPopup with the Square link.</p>
    <header class="ins-hero">${crest(34)}<div><h1>JF+ Insights</h1><p>Your last 12 weeks, read for you</p></div></header>
    <section class="jpg-card"><div class="jpg-head"><span class="klabel">From your own data</span><h2>Your pattern</h2></div><p style="margin:0;font-size:14px;color:var(--m-body)">On days you log protein, you finish 81% of habits vs 52% without a protein log.</p><p class="jpg-note">Based on 14 and 11 recorded days</p></section>
    <div class="ghost" aria-hidden="true"><div class="jpg-card"><span class="gl" style="width:40%"></span><span class="gl" style="width:70%;height:16px"></span><span class="gl" style="width:80%"></span><span class="gl" style="width:60%"></span></div><div class="jpg-card"><span class="gl" style="width:40%"></span><span class="gl" style="height:70px"></span></div></div>
    <div class="unlock">${crest(40)}<h2>See the whole picture</h2>
      <ul><li><b>A weekly review from JFI</b><span>Three things it noticed and one thing to try.</span></li><li><b>12 weeks, week by week</b><span>Steps, training, habits, sleep and weight, side by side.</span></li><li><b>Your own patterns</b><span>What your best weeks have in common, with the numbers behind it.</span></li></ul>
      <button class="unlock-cta">Unlock JF+ Insights</button><p class="price">$5 a week · cancel any time</p></div>`;
}
function card() {
  const on = state.trainer === "on";
  return `<div class="tc-nav"><button class="tc-back">‹ Clients</button></div>
    <p class="note-strip">${on ? "NEW (flag trainerClientInsights on or demo): one row on the client card. The API is asked first; another trainer's client is refused by the API, not only hidden." : state.trainer === "off" ? "TODAY (flag off): the card is unchanged; the API answers 404 and no row shows." : "Another trainer's client: this card is not reachable (\"This client is not in your account\"); the API refuses Insights with 403."}</p>
    <div class="tc-hero"><span class="av">SC</span><span class="n">Sam C.</span><span class="st">Next session Tue 17 Nov, 6:30 AM</span></div>
    <div class="pills"><span class="pill">Message</span><span class="pill q">Schedule</span><span class="pill q">Open app</span></div>
    <div class="tg">
      <div class="tr"><span class="tico" style="background:var(--t-info)">✓</span><span class="tx"><span class="t">Check-ins</span><span class="s">Weekly check-in answers</span></span>${chev}</div>
      <div class="tr"><span class="tico" style="background:var(--t-health)">♥</span><span class="tx"><span class="t">Habits</span><span class="s">4 habits</span></span>${chev}</div>
      <div class="tr"><span class="tico" style="background:var(--t-effort)">🔥</span><span class="tx"><span class="t">Nutrition targets</span><span class="s">1,500 kcal · 110 g protein</span></span>${chev}</div>
      <div class="tr"><span class="tico" style="background:var(--t-success)">↗</span><span class="tx"><span class="t">Progress</span><span class="s">Latest weight 58kg</span></span>${chev}</div>
      ${on ? `<button class="tr new" data-go="tins">${crest(30)}<span class="tx"><span class="t">JF+ Insights</span><span class="s">Sam's steps, sleep, weight, mood, heart rate and food, week by week</span></span>${chev}</button>` : ""}
    </div>`;
}
function tins() {
  if (state.trainer === "other") return `<div class="tc-nav"><button class="tc-back" data-go="card">‹ Client</button></div><header class="tci-hero">${crest(34)}<div><h1>JF+ Insights</h1><p>Loading...</p></div></header><div class="tg"><div class="tc-state" role="alert">This client is not in your book.</div></div>`;
  if (state.trainer === "off") return `<div class="tc-nav"><button class="tc-back" data-go="card">‹ Client</button></div><p class="note-strip">Flag off: there is no row to reach this; a direct link shows this line.</p><header class="tci-hero">${crest(34)}<div><h1>JF+ Insights</h1><p>Loading...</p></div></header><div class="tg"><div class="tc-state">JF+ Insights for trainers are not switched on yet.</div></div>`;
  const c = calories();
  const tile = (k, v, u, d, dir, s) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}${u ? `<small>${u}</small>` : ""}</span><span class="d ${dir}">${d}</span><span class="s">${s}</span></div>`;
  return `<div class="tc-nav"><button class="tc-back" data-go="card">‹ Sam</button></div>
    <header class="tci-hero">${crest(34)}<div><h1>JF+ Insights</h1><p>Sam's last 4 weeks · to Mon 16 Nov</p></div></header>
    <div class="tci-weeks" role="group" aria-label="Weeks shown"><button aria-pressed="true">4 weeks</button><button aria-pressed="false">8 weeks</button><button aria-pressed="false">12 weeks</button></div>
    <div class="tg" style="margin-top:14px"><div class="tr">${crest(28)}<span class="tx"><span class="t">Sam is not on JF+</span><span class="s">Their app shows a short JF+ preview; you see their logged data here</span></span></div></div>
    <div class="tsec">Headlines</div>
    <div class="tiles">
      ${tile("Average daily steps", "7,930", "steps", "↑ 9%", "good", "Based on 26 days")}
      ${tile("Logged workouts", "11", "", "↑ 22%", "good", "Based on 11 workouts")}
      ${tile("Past PT sessions", "8", "", "→ 0%", "flat", "Based on 8 sessions")}
      ${tile("Average sleep", "7.1", "hours", "↑ 4%", "flat", "Based on 24 nights")}
      ${tile("Latest weight", "58", "kg", "↓ 2%", "good", "Based on 5 weigh-ins")}
      ${tile("Average logged protein", "104", "g", "↑ 6%", "bad", "Based on 22 days")}
    </div>
    <div class="tsec">Health</div>
    <section class="tci-card"><h3>Steps</h3><p class="lead">Average a day, each week</p>${chart({ lines: [{ label: "Steps", tone: "a", points: weeks.map((w, i) => [w, steps[i]]) }], goal: 8000, goalLabel: "Step goal", height: 120, unit: " steps" })}</section>
    <section class="tci-card"><h3>Sleep</h3><p class="lead">Average a night, each week</p>${chart({ lines: [{ label: "Sleep", tone: "a", points: weeks.map((w, i) => [w, sleep[i]]) }], height: 120, unit: " hours" })}</section>
    <section class="tci-card"><h3>Body weight</h3><p class="lead">Every weigh-in in this range</p>${chart({ lines: [{ label: "Weigh-ins", tone: "a", points: weigh }], goal: 55, goalLabel: "Goal weight", height: 120, unit: " kg" })}<p class="tci-note">Trend down about 0.38 kg a week across 5 weigh-ins.</p></section>
    <section class="tci-card"><h3>Resting heart rate</h3><p class="lead">From their connected health app</p>${chart({ lines: [{ label: "Resting heart rate", tone: "a", points: hr }], height: 110, unit: " bpm" })}<p class="tci-note">Average 60 bpm over ${hr.length} days.</p></section>
    <section class="tci-card"><h3>Mood</h3><p class="lead">Daily mood rating, out of 5</p>${chart({ lines: [{ label: "Mood", tone: "a", points: mood }], height: 110, unit: "/5" })}<p class="tci-note">Average 4.2/5 over ${mood.length} days.</p></section>
    <div class="tsec">Food and energy</div>
    <section class="tci-card"><h3>Calories</h3><p class="lead">Each day food was logged. Dotted line: calorie target</p>${chart({ lines: [{ label: "Calories eaten", tone: "a", points: c.pts }], goal: 1500, goalLabel: "Calorie target", height: 120, unit: " kcal" })}</section>
    <section class="tci-card"><h3>Protein, carbs and fat</h3><p class="lead">Each dotted line is that target</p>${macroCharts((t) => `<p class="tci-sub">${t}</p>`)}</section>
    <section class="tci-card"><h3>Energy in vs energy out</h3><p class="lead">In: logged food. Out: BMR + active energy from their health app + about 10% of food for digestion</p>${energyChart()}
      <p class="tci-note strong">On the ${both.length} days with both logged, Sam was in a deficit of about ${fmt(avgGap)} kcal a day.</p>
      <p class="tci-note">Dotted line: BMR, about ${fmt(BMR)} kcal a day. Solid line: TDEE, about ${fmt(TDEE)} kcal a day.</p></section>
    <p class="foot">Built only from what Sam logs and connects. Sam is not notified when you look.</p>`;
}

function render() {
  const dev = document.getElementById("device"), view = document.getElementById("view");
  document.documentElement.toggleAttribute("data-dark", state.theme === "dark");
  dev.dataset.w = state.w;
  const trainer = state.screen !== "progress";
  dev.classList.toggle("trainer", trainer);
  document.getElementById("f-client").hidden = trainer;
  document.getElementById("f-trainer").hidden = !trainer;
  view.innerHTML = state.page === "ins-member" ? insMember() : state.page === "ins-locked" ? insLocked()
    : state.screen === "progress" ? progress() : state.screen === "card" ? card() : tins();
  document.querySelectorAll(".bar button").forEach((b) => b.setAttribute("aria-pressed", String(state[b.dataset.k] === b.dataset.v)));
  document.getElementById("scroll").scrollTop = 0;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (b) { state[b.dataset.k] = b.dataset.v; if (b.dataset.k !== "w" && b.dataset.k !== "theme") state.page = null; render(); return; }
  const go = e.target.closest("[data-go]");
  if (!go) return;
  const to = go.dataset.go;
  if (to === "back") state.page = null;
  else if (to === "ins-member" || to === "ins-locked") state.page = to;
  else { state.page = null; state.screen = to; }
  render();
});
render();
</script>
</body>
</html>

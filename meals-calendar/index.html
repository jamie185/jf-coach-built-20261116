<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Targets and Calendar Marks</title>
<style>
/* Mock of changes 791 (meal guide targets) and 792 (calendar moved / cancelled), as built. Made-up people only.
   Colours, words and layout copy the app's own tokens: client app --m-* (ios26.css), trainer app --t-*
   (trainer-theme.css), desktop console fixed light colours. No external requests. */
:root {
  --page: #eef1f6; --ui: #ffffff; --ui-ink: #222326; --ui-muted: rgba(31,32,37,.6); --ui-line: #e3e7ee;
  /* client app (light) */
  --m-page: #f2f2f7; --m-card: #ffffff; --m-ink: #000000; --m-muted: #6c6c70; --m-line: rgba(60,60,67,.18); --m-warning-ink: #8a6300; --m-sky: #4da3ff;
  /* trainer app (light) */
  --t-canvas: #f2f2f7; --t-tile: #ffffff; --t-ink: #000000; --t-ink2: rgba(60,60,67,.76); --t-hair: rgba(60,60,67,.18); --t-accent: #0a5fc8; --t-accent-soft: rgba(77,163,255,.13); --t-card: #e9eef6;
  --t-success: #8bd42a; --t-success-ink: #3f7a0a; --t-success-soft: rgba(139,212,42,.13);
  --t-alert: #ff5e3a; --t-alert-ink: #d23b17; --t-alert-soft: rgba(255,94,58,.13);
}
body { margin: 0; background: var(--page); color: var(--ui-ink); font: 500 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
.dark { --m-page: #000000; --m-card: #1c1c1e; --m-ink: #ffffff; --m-muted: #98989f; --m-line: rgba(84,84,88,.5); --m-warning-ink: #ffb340;
  --t-canvas: #000000; --t-tile: #1c1c1e; --t-ink: #ffffff; --t-ink2: rgba(235,235,245,.66); --t-hair: rgba(84,84,88,.65); --t-accent: #3b9bff; --t-accent-soft: rgba(77,163,255,.2); --t-card: #2c2c2e;
  --t-success-ink: #9fe04a; --t-success-soft: rgba(139,212,42,.18); --t-alert-ink: #ff7a5c; --t-alert-soft: rgba(255,94,58,.2); }
header.bar { position: sticky; top: 0; z-index: 10; background: rgba(238,241,246,.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--ui-line); padding: 12px 16px; }
header.bar h1 { margin: 0 0 8px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.seg { display: inline-flex; background: #e4e8ef; border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 600; color: var(--ui-ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: #1f2025; color: #ebf0f8; }
.seg-k { font-size: 12px; font-weight: 700; color: var(--ui-muted); text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; }
main { padding: 20px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.note { max-width: 820px; font-size: 13px; color: var(--ui-muted); }
.device { width: 390px; max-width: 100%; border-radius: 34px; overflow: hidden; box-shadow: 0 16px 40px -18px rgba(30,40,70,.35); border: 8px solid #1f2025; }
.device.ipad { width: 820px; border-radius: 26px; }
.device.desk { width: 1100px; border-radius: 12px; border-width: 1px; border-color: var(--ui-line); }

/* ---------- client app: Food tab ---------- */
.m-root { background: var(--m-page); color: var(--m-ink); padding: 0 16px 40px; min-height: 640px; }
.m-nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 6px; }
.m-nav b { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.m-date { font-size: 15px; color: var(--m-muted); font-weight: 600; }
.m-wrap { max-width: 560px; margin: 0 auto; }
.card { background: var(--m-card); border-radius: 26px; padding: 16px; margin-top: 11px; }
.sum-k { font-size: 13px; color: var(--m-muted); font-weight: 600; }
.sum-v b { font-size: 34px; font-weight: 700; letter-spacing: -.03em; }
.sum-v span { color: var(--m-muted); font-weight: 600; }
.bar6 { height: 6px; border-radius: 6px; background: rgba(120,120,128,.16); overflow: hidden; margin-top: 8px; }
.bar6 i { display: block; height: 100%; background: var(--m-sky); border-radius: 6px; }
.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.macro small { display: block; font-size: 12px; color: var(--m-muted); font-weight: 600; }
.macro b { font-variant-numeric: tabular-nums; }
.macro i { font-style: normal; color: var(--m-muted); font-size: 12px; font-weight: 600; }
.guide-btn { float: right; border: 0; background: rgba(120,120,128,.16); color: var(--m-ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; }
.more-link { border: 0; background: none; color: #0a84ff; font: inherit; font-weight: 600; padding: 8px 0 0; cursor: pointer; }
.dark .more-link { color: #64d2ff; }
.fold { display: flex; gap: 10px; align-items: baseline; padding: 12px 4px 4px; }
/* Today's Targets (meal-targets.css) */
.jf-meal-targets { display: grid; gap: 10px; }
.jf-mt-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.jf-mt-title { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.jf-mt-source { font-size: 13px; font-weight: 600; color: var(--m-muted); }
.jf-mt-row { display: grid; grid-template-columns: minmax(64px,1.1fr) repeat(3, minmax(0,1fr)); align-items: baseline; gap: 8px; padding: 9px 0; border-top: 1px solid var(--m-line); }
.jf-mt-row.two { grid-template-columns: minmax(64px,1.1fr) 1fr; }
.jf-mt-row.head { padding: 0 0 6px; border-top: 0; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--m-muted); }
.jf-mt-row.head > span:not(.lbl), .num { text-align: right; }
.lbl { font-size: 13px; font-weight: 700; }
.num { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.num i { font-style: normal; font-size: 12px; font-weight: 600; color: var(--m-muted); }
.is-over .left, .is-over .left i { color: var(--m-warning-ink); }
.jf-mt-note { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--m-muted); }
.jf-mt-foot { border-top: 1px solid var(--m-line); padding-top: 2px; }
.meal { display: grid; grid-template-columns: 1fr; overflow: hidden; padding: 0; }
.meal .photo { height: 150px; background: linear-gradient(135deg, #f6d9b8, #e7b98a 45%, #c98b5a); }
.meal.b .photo { background: linear-gradient(135deg, #d9edc6, #a9d58d 50%, #6fae5a); }
.meal .body { padding: 12px 16px 14px; display: flex; align-items: center; gap: 10px; }
.meal .body div { flex: 1; }
.meal .slot { font-size: 13px; color: var(--m-muted); font-weight: 600; display: block; }
.meal .name { font-size: 17px; font-weight: 600; }
.eat { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; background: #0a84ff; color: #fff; }
.eat.tint { background: rgba(10,132,255,.14); color: #0a84ff; }
.ipad .m-wrap { max-width: 560px; }

/* ---------- trainer app: Schedule ---------- */
.t-root { background: var(--t-canvas); color: var(--t-ink); min-height: 640px; padding-bottom: 30px; }
.t-head { padding: 16px 20px 4px; font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
.t-foot { font-size: 13px; color: var(--t-ink2); margin: 10px 20px 0; }
.t-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.t-list { padding: 4px 16px 24px; }
.t-day { margin-top: 22px; }
.t-day h2 { margin: 0; padding: 0 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; display: flex; justify-content: space-between; }
.t-day h2 span { font-size: 15px; font-weight: 400; color: var(--t-ink2); }
.t-day.past { opacity: .72; }
.t-group { margin-top: 10px; background: var(--t-tile); border-radius: 26px; overflow: hidden; }
.t-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 60px; }
.t-row + .t-row { border-top: 1px solid var(--t-hair); }
.t-time { width: 70px; flex-shrink: 0; display: flex; flex-direction: column; }
.t-time b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-time span { font-size: 13px; color: var(--t-ink2); font-variant-numeric: tabular-nums; }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--t-card); color: var(--t-ink2); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.t-main { flex: 1; min-width: 0; }
.t-name { display: block; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub { display: block; font-size: 13px; color: var(--t-ink2); margin-top: 1px; line-height: 1.35; }
.chev { color: var(--t-ink2); font-size: 18px; }
.msg { width: 34px; height: 34px; border-radius: 50%; background: var(--t-accent-soft); color: var(--t-accent); display: grid; place-items: center; font-size: 15px; }
.row-cancel { background: var(--t-alert-soft); box-shadow: inset 4px 0 0 var(--t-alert); }
.row-cancel .t-time { color: var(--t-alert-ink); text-decoration: line-through; }
.row-cancel .t-time span { color: var(--t-alert-ink); }
.row-cancel .t-name { color: var(--t-ink2); text-decoration: line-through; }
.mk-moved { font-weight: 600; color: var(--t-success-ink); }
.mk-cancel { font-weight: 600; color: var(--t-alert-ink); }

/* ---------- desktop console calendar ---------- */
.d-root { background: #f7f9fc; color: #141742; min-height: 560px; font-size: 13px; }
.d-tool { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; }
.d-tool h3 { margin: 0; font-size: 20px; font-weight: 700; }
.d-legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; font-weight: 600; color: #5b6478; }
.d-legend > span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sw2 { width: 14px; height: 14px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; line-height: 1; }
.d-grid { margin: 0 16px 16px; border: 1px solid #dfe5ee; border-radius: 14px; background: #fff; overflow: hidden; display: grid; grid-template-columns: 56px repeat(5, 1fr); }
.d-grid.narrow { grid-template-columns: 48px repeat(3, 1fr); }
.d-h { padding: 8px; text-align: center; font-size: 12px; color: #5b6478; border-bottom: 1px solid #dfe5ee; border-left: 1px solid #dfe5ee; }
.d-h.today { color: #2f52c9; font-weight: 700; background: rgba(47,82,201,.10); }
.d-hours { border-right: 1px solid #dfe5ee; }
.d-hours div { height: 56px; font-size: 11px; color: #8a90a0; text-align: right; padding-right: 6px; }
.d-col { position: relative; border-left: 1px solid #dfe5ee; background: repeating-linear-gradient(#fff 0 55px, #eef1f6 55px 56px); height: 448px; }
.tile { position: absolute; left: 3px; right: 3px; border-radius: 8px; padding: 3px 7px; overflow: hidden; line-height: 1.2; cursor: pointer; }
.tile b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile span { display: block; font-size: 10.5px; font-weight: 600; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .mk { opacity: 1; display: inline; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2025; color: #ebf0f8; padding: 10px 16px; border-radius: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }
@media (max-width: 420px) { .device { border-width: 0; border-radius: 0; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <h1>Meal guide targets (791) and calendar moved / cancelled (792)</h1>
  <div class="controls">
    <span><span class="seg-k">Screen</span><span class="seg" data-k="screen"><button data-v="meal" aria-pressed="true">Meal guide</button><button data-v="phone">Trainer schedule</button><button data-v="desk">Desktop calendar</button></span></span>
    <span><span class="seg-k">Width</span><span class="seg" data-k="width"><button data-v="phone" aria-pressed="true">Phone 390</button><button data-v="ipad">iPad 820</button></span></span>
    <span><span class="seg-k">Theme</span><span class="seg" data-k="theme"><button data-v="light" aria-pressed="true">Light</button><button data-v="dark">Dark</button></span></span>
    <span><span class="seg-k">Switch</span><span class="seg" data-k="flag"><button data-v="on" aria-pressed="true">On</button><button data-v="off">Off (today)</button></span></span>
    <span id="mealOpts"><label class="chk"><input type="checkbox" id="over"> Over on carbs</label> <label class="chk"><input type="checkbox" id="unknown"> Food not loaded</label> <label class="chk"><input type="checkbox" id="calOnly"> Only a calorie target on file</label></span>
  </div>
</header>
<main>
  <p class="note" id="note"></p>
  <div id="stage"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const S = { screen: "meal", width: "phone", theme: "light", flag: "on" };
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  S[seg.dataset.k] = b.dataset.v;
  seg.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
["over", "unknown", "calOnly"].forEach((id) => document.getElementById(id).addEventListener("change", render));
const n = (v) => Number(v).toLocaleString("en-AU");
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2200); }

/* the same maths as mealTargets.mjs */
function rows(goal, eaten) {
  const defs = [["cal", "Calories", "cal"], ["protein", "Protein", "g"], ["carbs", "Carbs", "g"], ["fat", "Fat", "g"]];
  return defs.filter(([k]) => Number(goal[k]) > 0).map(([k, label, unit]) => {
    const target = Math.round(goal[k]); const had = eaten == null ? null : Math.round(eaten[k] || 0);
    const d = had == null ? null : target - had;
    return { k, label, unit, target, eaten: had, left: d == null ? null : Math.max(0, d), over: d == null ? null : Math.max(0, -d) };
  });
}
function spoken(r) { const u = r.unit === "cal" ? "calories" : "grams"; const h = `${r.label}: ${n(r.target)} ${u} target`; if (r.eaten == null) return h + "."; return r.over > 0 ? `${h}, ${n(r.eaten)} eaten, ${n(r.over)} over.` : `${h}, ${n(r.eaten)} eaten, ${n(r.left)} left.`; }

function mealScreen() {
  const over = document.getElementById("over").checked, unknown = document.getElementById("unknown").checked, calOnly = document.getElementById("calOnly").checked;
  const goal = calOnly ? { cal: 2000 } : { cal: 2000, protein: 150, carbs: 200, fat: 60 };
  const eaten = { cal: 1240, protein: 90, carbs: over ? 236 : 121, fat: 30 };
  const R = rows(goal, unknown ? null : eaten);
  const known = R.every((r) => r.eaten != null);
  const on = S.flag === "on";
  const summary = unknown ? "" : `<section class="card" aria-label="Eaten">
      <button class="guide-btn" type="button">Guide</button>
      <div class="sum-k">Eaten today</div>
      <div class="sum-v"><b>${n(eaten.cal)}</b><span> of ${n(goal.cal)} cal</span></div>
      <div class="bar6"><i style="width:${Math.min(100, eaten.cal / goal.cal * 100)}%"></i></div>
      <div class="macros">${["protein", "carbs", "fat"].map((k) => `<div class="macro"><small>${k[0].toUpperCase() + k.slice(1)}</small><b>${n(eaten[k])}</b>${goal[k] ? `<i> of ${n(goal[k])} g</i>` : "<i> g</i>"}</div>`).join("")}</div>
      <button class="more-link" type="button">Show Details ⌄</button>
    </section>`;
  const targets = on ? `<section class="card jf-meal-targets" data-testid="meal-guide-targets">
      <div class="jf-mt-head"><h3 class="jf-mt-title">Today's Targets</h3><span class="jf-mt-source">Set by your trainer</span></div>
      <div role="table" aria-label="Today's targets">
        <div class="jf-mt-row head${known ? "" : " two"}" role="row"><span class="lbl" role="columnheader"></span><span role="columnheader">Target</span>${known ? '<span role="columnheader">Eaten</span><span role="columnheader">Left</span>' : ""}</div>
        ${R.map((r) => `<div class="jf-mt-row${known ? "" : " two"}${r.over ? " is-over" : ""}" role="row" aria-label="${spoken(r)}">
          <span class="lbl" role="rowheader">${r.label}</span>
          <span class="num" role="cell">${n(r.target)}<i> ${r.unit}</i></span>
          ${known ? `<span class="num" role="cell">${n(r.eaten)}<i> ${r.unit}</i></span><span class="num left" role="cell">${r.over ? `${n(r.over)}<i> over</i>` : `${n(r.left)}<i> ${r.unit}</i>`}</span>` : ""}
        </div>`).join("")}
      </div>
      ${known ? "" : '<p class="jf-mt-note" role="status">Eaten totals are not available right now.</p>'}
      <div class="jf-mt-foot"><button class="more-link" type="button" onclick="toast('Opens the full plan sheet (unchanged)')">View Full Plan</button></div>
    </section>` : "";
  const fold = on ? "" : `<div class="fold"><button class="more-link" type="button" onclick="toast('Opens the full plan sheet (unchanged)')">Full Plan</button></div>`;
  return `<div class="m-root"><div class="m-wrap">
    <div class="m-nav"><b>Food</b><span class="m-date">Today, Mon 16 Nov</span></div>
    ${summary}
    ${targets}${fold}
    <section class="card meal"><div class="photo" aria-hidden="true"></div><div class="body"><div><span class="slot">Lunch · 520 cal</span><span class="name">Chicken rice bowl</span></div><button class="eat" type="button">Mark Eaten</button><span aria-hidden="true">•••</span></div></section>
    <section class="card meal b"><div class="photo" aria-hidden="true"></div><div class="body"><div><span class="slot">Dinner · 610 cal</span><span class="name">Salmon and greens</span></div><button class="eat tint" type="button">Mark Eaten</button><span aria-hidden="true">•••</span></div></section>
  </div></div>`;
}

const KT = { ongoing: "#2F6FED", kickstart: "#1F9D63", free: "#E9A23B" };
function phoneScreen() {
  const on = S.flag === "on";
  const row = (t, e, name, sub, type, moved) => `<div class="t-row" style="box-shadow: inset 4px 0 0 ${KT[type]};${moved && on ? "background: var(--t-success-soft);" : ""}" role="button" tabindex="0">
      <span class="t-time"><b>${t}</b><span>${e}</span></span><span class="av">${name.split(" ").map((w) => w[0]).join("")}</span>
      <span class="t-main"><span class="t-name">${name}</span><span class="t-sub">${moved && on ? '<span class="mk-moved"><span aria-hidden="true">↻ </span>Moved</span>, ' : ""}${sub}</span></span>
      ${type !== "free" ? '<span class="msg" aria-hidden="true">✉</span>' : ""}<span class="chev" aria-hidden="true">›</span></div>`;
  const cancel = (t, e, name, sub) => `<div class="t-row row-cancel" role="group" aria-label="Cancelled: ${name}, ${t}">
      <span class="t-time"><b>${t}</b><span>${e}</span></span>
      <span class="t-main"><span class="t-name">${name}</span><span class="t-sub"><span class="mk-cancel"><span aria-hidden="true">× </span>Cancelled</span>, ${sub}</span></span></div>`;
  return `<div class="t-root">
    <div class="t-head">Schedule</div>
    <div class="t-foot">Appointments and admin work appear together by time. Admin work has no client.</div>
    ${on ? `<div class="t-foot t-legend"><span><span aria-hidden="true" style="color:var(--t-success);font-weight:700">↻ </span><span class="mk-moved">Moved</span>: shown green at its new time</span><span><span aria-hidden="true" style="color:var(--t-alert);font-weight:700">× </span><span class="mk-cancel" style="text-decoration:line-through">Cancelled</span>: shown red on the day it was</span></div>` : ""}
    <div class="t-list">
      <section class="t-day past"><h2>Sun 15 Nov <span>Completed</span></h2>
        <div class="t-group">${row("8:00am", "8:45am", "Liam S.", "1on1 45 minutes, 45 min", "ongoing")}</div>
        ${on ? `<div class="t-group">${cancel("6:00am", "6:45am", "Zoe P.", "1on1 45 minutes, 45 min")}</div>` : ""}
      </section>
      <section class="t-day"><h2>Today</h2>
        <div class="t-group">
          ${row("6:00am", "6:45am", "Mia K.", "1on1 45 minutes, 45 min", "ongoing", true)}
          ${row("7:15am", "8:00am", "Tom R.", "21 Day Kickstart, 45 min", "kickstart")}
          ${row("5:30pm", "6:00pm", "Priya N.", "Fitness Discovery Session, 30 min, tap for appointment details", "free")}
        </div>
        ${on ? `<div class="t-group">${cancel("6:00pm", "6:30pm", "Liam S.", "1on1 30 minutes, 30 min")}</div>` : ""}
      </section>
      ${on ? `<section class="t-day"><h2>Tue 17 Nov</h2><div class="t-group">${cancel("7:15am", "8:00am", "Tom R.", "21 Day Kickstart, 45 min")}</div></section>` : ""}
      <section class="t-day"><h2>Wed 18 Nov</h2><div class="t-group">${row("7:15am", "8:00am", "Tom R.", "21 Day Kickstart, 45 min", "kickstart", true)}</div></section>
    </div></div>`;
}

function deskScreen() {
  const on = S.flag === "on";
  const narrow = S.width === "phone";
  const days = narrow ? ["Mon 16", "Tue 17", "Wed 18"] : ["Mon 16", "Tue 17", "Wed 18", "Thu 19", "Fri 20"];
  const tint = (c) => `background: color-mix(in srgb, ${c} 22%, white); color: #141742; box-shadow: inset 3px 0 0 ${c}`;
  const ev = {
    "Mon 16": [[0, 45, "Mia K.", "6:00 am", "1on1", "ongoing", "moved"], [75, 45, "Tom R.", "7:15 am", "21 Day KSP", "kickstart"], [690, 30, "Priya N.", "5:30 pm", "Fitness Discovery", "free"], [720, 30, "Liam S.", "6:00 pm", "1on1", "ongoing", "cancelled"]],
    "Tue 17": [[75, 45, "Tom R.", "7:15 am", "21 Day KSP", "kickstart", "cancelled"], [180, 45, "Zoe P.", "9:00 am", "1on1", "ongoing"]],
    "Wed 18": [[75, 45, "Tom R.", "7:15 am", "21 Day KSP", "kickstart", "moved"]],
    "Thu 19": [[60, 45, "Liam S.", "7:00 am", "1on1", "ongoing"]],
    "Fri 20": [[0, 45, "Mia K.", "6:00 am", "1on1", "ongoing"]],
  };
  const scale = 448 / 480; /* 6am to 2pm shown, plus evening compressed for the mock */
  const top = (m) => (m > 480 ? 360 + (m - 690) * 0.9 : m * scale * 0.8);
  const tile = ([m, d, name, time, type, ctype, mark]) => {
    if (mark === "cancelled" && !on) return "";
    const m2 = mark && on ? mark : null;
    let style = tint(KT[ctype]);
    if (m2 === "moved") style += `, inset 0 0 0 2px #1E9E4A`;
    if (m2 === "cancelled") style = "background: rgba(214,69,69,.10); color: #B3261E; box-shadow: inset 3px 0 0 #D64545; text-decoration: line-through";
    const label = m2 ? `<span class="mk" style="color:${m2 === "moved" ? "#14753A" : "#B3261E"};display:inline-block;text-decoration:none"><span aria-hidden="true">${m2 === "moved" ? "↻" : "×"} </span>${m2 === "moved" ? "Moved" : "Cancelled"} · </span>` : "";
    const click = m2 === "cancelled" ? `toast('Cancelled: ${type}: ${name} · read-only (no move, no edit)')` : `toast('Opens the appointment (unchanged)')`;
    return `<div class="tile" style="top:${top(m)}px;height:${Math.max(20, d * 0.75)}px;${style}" ${m2 ? `aria-label="${m2 === "moved" ? "Moved" : "Cancelled"}: ${name}, ${time}"` : ""} onclick="${click}"><b>${name}</b><span>${label}${time} · ${type}</span></div>`;
  };
  return `<div class="d-root">
    <div class="d-tool"><h3>November 2026</h3>
      <div class="d-legend">
        <span><span class="sw" style="background:${KT.ongoing}"></span>Ongoing</span><span><span class="sw" style="background:${KT.kickstart}"></span>Kickstart</span><span><span class="sw" style="background:${KT.free}"></span>Free session</span>
        ${on ? `<span style="color:#14753A"><span class="sw2" aria-hidden="true" style="box-shadow: inset 0 0 0 2px #1E9E4A">↻</span>Moved</span><span style="color:#B3261E"><span class="sw2" aria-hidden="true" style="background: rgba(214,69,69,.10); box-shadow: inset 3px 0 0 #D64545">×</span><span style="text-decoration:line-through">Cancelled</span></span>` : ""}
        <span><input type="checkbox" checked aria-label="Colours"> Colours</span>
      </div>
    </div>
    <div class="d-grid${narrow ? " narrow" : ""}">
      <div class="d-h"></div>${days.map((d, i) => `<div class="d-h${i === 0 ? " today" : ""}">${d}</div>`).join("")}
      <div class="d-hours">${["6am", "7am", "8am", "9am", "10am", "11am", "…", "6pm"].map((h) => `<div>${h}</div>`).join("")}</div>
      ${days.map((d) => `<div class="d-col">${(ev[d] || []).map(tile).join("")}</div>`).join("")}
    </div></div>`;
}

function render() {
  document.getElementById("mealOpts").style.display = S.screen === "meal" ? "" : "none";
  const stage = document.getElementById("stage");
  const cls = S.screen === "desk" ? (S.width === "phone" ? "device" : "device desk") : S.width === "ipad" ? "device ipad" : "device";
  const html = S.screen === "meal" ? mealScreen() : S.screen === "phone" ? phoneScreen() : deskScreen();
  stage.innerHTML = `<div class="${cls}${S.theme === "dark" && S.screen !== "desk" ? " dark" : ""}">${html}</div>`;
  const notes = {
    meal: S.flag === "on" ? "791 on: Today's Targets sits at the top of the meal guide (below the Food summary, which is unchanged); a row only for a target on file; over target says \"over\" in words and in the warning tone; View Full Plan at the card's foot, directly above today's meals. Shown only on today." : "791 off: exactly today's Food tab (Full Plan row above the meals).",
    phone: S.flag === "on" ? "792 on: a moved session is green-tinted with \"↻ Moved\" at its new time; a cancelled one is red, struck through, \"× Cancelled\", read-only, under that day's sessions. Client-type stripes unchanged. Hidden while searching or selecting." : "792 off: exactly today's schedule (cancelled sessions are not shown at all, as now).",
    desk: S.flag === "on" ? "792 on (desktop console, light only): moved = client-type tile + green ring + \"↻ Moved\"; cancelled = red struck-through tile + \"× Cancelled\", click shows a read-only note, never drag or edit. Legend adds Moved and Cancelled." : "792 off: exactly today's desktop calendar.",
  };
  document.getElementById("note").textContent = notes[S.screen] + (S.screen === "desk" && S.theme === "dark" ? " (The desktop console has no dark theme today.)" : "");
}
render();
</script>
</body>
</html>
